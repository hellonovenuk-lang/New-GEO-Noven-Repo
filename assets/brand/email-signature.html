<!-- Wardith email signature — paste into Zoho Mail.

     Written 2026-08-07 to replace `Email Signature.svg`, which is kept in this
     folder as the supplied original and should not be used. Two reasons it was
     replaced rather than re-exported:

     1. **It said `hello@wardith.com` above `wardith.co.uk`** — two domains, one
        business, in the asset that goes out on every message. That is precisely
        the fault this business is sold to find in other people's businesses.
     2. **Its text is outlined paths, not type.** Correcting two words meant a
        Canva round trip, and the address for service still has to be added on
        26 August. Facts baked into artwork have to be re-exported every time
        they change; facts in live text are an edit. Given the fault above was
        caused by exactly that friction, the format was the root cause.

     **Email cannot render SVG.** Outlook, Gmail's web client and most corporate
     gateways drop it or show a broken image, so an SVG signature was never
     going to survive contact with a recipient regardless of what it said.

     **How to install it in Zoho Mail:** Settings → Mail → Signatures → new
     signature → open the source view (the `<>` button in the editor toolbar) →
     paste everything below the marker → save. Set it for new mail *and* for
     replies; a signature that only appears on new messages is missing from the
     majority of what you send.

     **Design notes, so a later session does not "improve" it by accident:**

     - **Tables and inline styles only.** Not a style choice — Outlook renders
       through Word, which ignores `<style>` blocks, floats and flexbox.
     - **The font stack is the one CLAUDE.md already picked**: Palatino Linotype
       for the serif, Segoe UI for the sans. Both ship with Windows and Office,
       so this matches the site on the machines that will actually open it.
       Newsreader and IBM Plex are webfonts and do not exist in email.
     - **The wordmark is the committed artwork**, rasterised from
       `site/public/logo.svg` at 2x (312x58 actual, 156x29 displayed) with no
       path data altered — the SVG was placed in a page at a fixed size and
       photographed, which is the same "never redraw the logo" rule
       `assets/brand/trim.mjs` works under. Regenerate it that way if it is ever
       needed at another size. It is served from the live site at
       `/signature-wordmark.png` so that it resolves for the recipient, which
       means **the file has to stay in `site/public/`** — deleting it as an
       orphan would silently break every signature already sitting in somebody
       else's inbox. **If images are blocked** — the default in
       Outlook desktop and many corporate clients — the `alt` text renders as
       the business name in navy, so the signature degrades to type rather than
       to a broken-image icon.
     - **One accent, the brass hairline.** Everything else is type and spacing.
     - **No service description**, deliberately. The old email banner said "AI
       Visibility Services" and removing it closed a fault that stood open from
       27 July (`archive/rename-to-wardith.md` B7). Nothing goes back in that slot
       without the owner deciding it should.

     **The address for service is in, 2026-08-10** — the placeholder that stood
     here is closed. A sole trader whose trading name is not their own surname
     has to disclose the owner's name and an address for service on business
     correspondence; both are now in the signature. It is the **mailbox** line,
     `BH16 6FA`. UK Postbox also issues a courier address, `BH16 6FH`, which is
     a routing instruction for carriers and must never appear here — the two
     addresses and their jobs are in `playbook/accounts-and-dates.md`.

     **This signature is now a published copy of a fact held elsewhere**, which
     is the one thing the format cannot protect against: it is pasted into Zoho
     and into every message already sent, so it does not update when
     `site/src/data/business.ts` does. If the address ever changes, this file
     and the Zoho signature are two of the places that have to change with it.

     **Reinstall it in Zoho after this edit.** The copy in Zoho is the one that
     actually goes out; editing this file changes nothing on its own.

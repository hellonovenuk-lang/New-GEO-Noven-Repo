<!doctype html>
<!-- The company page cover, 1128x191. Composed from the same three materials
     as the link-preview card in ../og/: brand navy #170969, warm white
     #fffefa, and one of the site's own statement lines in the Newsreader the
     site sets it in. The font is the copy already vendored for the og card,
     so this render doesn't depend on the network either. Rendered to
     cover-1128x191.png by render.mjs. -->
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Newsreader';
        font-style: normal;
        font-weight: 500;
        src: url('../og/fonts/Newsreader-500.woff2') format('woff2');
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1128px;
        height: 191px;
        overflow: hidden;
      }

      /* The logo badge overlaps the bottom-left of the cover on a company
         page, and LinkedIn trims the strip differently on a phone than on a
         desktop. So the type sits inside the middle, with the left kept clear
         for the badge and room to spare on the right. */
      body {
        background: #170969;
        display: flex;
        align-items: center;
        padding: 0 72px 0 264px;
      }

      /* The About page's statement line, in the site's own face and tracking,
         sized to the strip. Not the homepage headline: LinkedIn sets the
         page's tagline directly beneath the cover, and that tagline already
         ends "…ask an AI who to use", so the headline would have stacked the
         same phrase twice. This line says the thing the rest of the header
         doesn't — what kind of outfit is behind it — and it is the site's own
         sentence, not a new one written for LinkedIn. */
      p {
        font-family: 'Newsreader', serif;
        font-weight: 500;
        font-size: 40px;
        line-height: 1.1;
        letter-spacing: -0.024em;
        color: #fffefa;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <p>Small enough that you always know who did the work.</p>
  </body>
</html>
